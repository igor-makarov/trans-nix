[settings]
python.uv_venv_auto = "source"

[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
lua-language-server = "latest"
pkl = "latest"
python = "3.14"
ruff = "latest"
uv = "latest"
shellcheck = "latest"
stylua = "latest"

[tasks.format]
description = "Format Lua and Python sources"
run = [
  "stylua metadata.lua hooks/ lib/",
  "ruff format bin/trans-nix trans_nix/ tests/ e2e/",
  "ruff check --fix bin/trans-nix trans_nix/ tests/ e2e/",
]

[tasks.lint]
description = "Run static checks"
run = "hk check"

[tasks."test:unit"]
description = "Run offline Python unit tests"
run = "uv run --locked python3 -m unittest discover -s tests -v"

[tasks."test:e2e"]
description = "Run each E2E test in a separate macOS Seatbelt sandbox"
run = "python3 e2e/run.py native"

[tasks."test:docker"]
description = "Run each E2E test in a separate ephemeral Linux container"
run = "python3 e2e/run.py docker"

[tasks."test:all"]
description = "Run local native and Docker verification"
depends = ["lint", "test:unit", "test:e2e", "test:docker"]
